<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya's Work Log — Blakeworth Management</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0d; --surface:#191917; --surface2:#222220; --border:#2a2a27;
    --gold:#c9a84c; --gold-light:#e2c46a; --gold-dim:rgba(201,168,76,0.10);
    --text:#e8e4d9; --muted:#6e6c64; --soft:#a8a398;
    --green:#5cb87a; --red:#d96060;
    --G:#c9a84c; --B:#6a9fd8; --H:#7bbf8a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(201,168,76,0.04),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(106,159,216,0.03),transparent 60%);pointer-events:none;z-index:0;}


  /* Loading */
  #loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;transition:opacity .4s;}
  #loading.gone{opacity:0;pointer-events:none;}h
  .ld-logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);}
  .ld-track{width:160px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
  .ld-bar{height:100%;background:var(--gold);animation:slide 1.6s ease-in-out infinite;}
  @keyframes slide{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
  .ld-txt{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--muted);}


  /* Main */
  #app{display:none;max-width:1120px;margin:0 auto;padding:52px 28px 80px;position:relative;z-index:1;}


  /* Header */
  .eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,42px);font-weight:700;line-height:1.08;}
  .hdr-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:8px;}
  .sync-row{margin-top:12px;display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2.4s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .header{margin-bottom:32px;animation:up .5s ease both;}


  /* Due banner */
  .due{background:var(--gold-dim);border:1px solid rgba(201,168,76,.28);border-radius:10px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;opacity:0;animation:up .45s .05s ease both;}
  .due-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
  .due-month{font-family:'Playfair Display',serif;font-size:22px;color:var(--text);margin:4px 0 3px;}
  .due-note{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
  .due-right{text-align:right;}
  .due-amt-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .due-amt{font-family:'Playfair Display',serif;font-size:38px;color:var(--gold);line-height:1;}
  .due-hrs{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:4px;}
  /* Previous balance strip */
  .prev-bal{display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:rgba(210,50,50,0.14);border:1px solid rgba(210,50,50,0.45);border-radius:10px;padding:14px 22px;margin-bottom:14px;opacity:0;animation:up .45s .02s ease both;}
  .prev-bal.show{display:flex;}
  .prev-bal-left{display:flex;align-items:center;gap:10px;}
  .prev-bal-icon{font-size:14px;}
  .prev-bal-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#e06060;}
  .prev-bal-month{font-family:'DM Mono',monospace;font-size:10px;color:#ff8080;margin-top:2px;}
  .prev-bal-amt{font-family:'Playfair Display',serif;font-size:22px;color:#ff8080;line-height:1;}
  .prev-bal-note{font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,120,120,.7);margin-top:3px;}
  .wise-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#9fe870;color:#163300;border:none;border-radius:6px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .15s,transform .1s;}
  .wise-btn:hover{background:#b5f28a;}
  .wise-btn:active{transform:scale(.97);}


  /* LLC cards */
  .llc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
  @media(max-width:640px){.llc-row{grid-template-columns:1fr;}}
  .llc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px 20px;position:relative;overflow:hidden;opacity:0;animation:up .45s ease both;}
  .llc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
  .llc.G::before{background:var(--G);} .llc.B::before{background:var(--B);} .llc.H::before{background:var(--H);}
  .llc:nth-child(1){animation-delay:.10s;} .llc:nth-child(2){animation-delay:.15s;} .llc:nth-child(3){animation-delay:.20s;}
  .llc-name{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px;}
  .llc-name.G{color:var(--G);} .llc-name.B{color:var(--B);} .llc-name.H{color:var(--H);}
  .llc-props{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:14px;}
  .llc-amt{font-family:'Playfair Display',serif;font-size:28px;color:var(--text);line-height:1;}
  .llc-hrs{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:5px;}


  /* Stats */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px;}
  @media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr);}}
